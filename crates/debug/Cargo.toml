[package]
name = "universe-debug"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "universe-debug"
path = "src/main.rs"
required-features = ["dev-shell"]

[features]
dev-shell = ["dep:egui", "dep:egui-wgpu", "dep:winit", "dep:wgpu", "universe-engine/dev-shell"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
# D-003 first use (#44 Step 5): winit 0.30.13 locked in `universe-debug`
# behind the non-default `dev-shell` feature. Default features; no extra
# backends. Engine sim stays winit-free; main thread owns winit per
# docs/tech/architecture.md.
winit = { workspace = true, optional = true }
# D-003 first use (#44 Step 6): wgpu 30.0.1 locked in `universe-debug` behind
# the non-default `dev-shell` feature for the OS surface plus device. Default
# features; versions stay on the locked 30.0 line (`egui-wgpu` 0.36.2 requires
# wgpu ^30.0). Engine sim stays wgpu-free.
wgpu = { workspace = true, optional = true }
glam.workspace = true
libm.workspace = true
mimalloc.workspace = true
tracing.workspace = true
universe-engine.workspace = true
