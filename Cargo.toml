# Universe workspace. The `[workspace.lints]` block and `[profile.release]`
# are verbatim copies from `docs/tech/standards.md`, the single source of truth.

[workspace]
resolver = "2"
members = ["crates/engine", "crates/game", "crates/debug", "crates/tools", "."]
default-members = ["crates/engine", "crates/game", "crates/tools", "."]
# `universe-debug` is excluded from the default set: it is a dev-only shell
# and is never built unless requested (see `crates/debug/Cargo.toml`).

[workspace.package]
version = "0.1.0"
edition = "2024"
# Never published to a registry; choosing a license is a separate decision.
publish = false
# Floor from the max-MSRV rule in `docs/tech/stack.md`: `egui` 0.36.2 declares
# `rust-version` 1.95, so the workspace floors at 1.95, not 1.87.
rust-version = "1.95"

[workspace.dependencies]
# One source for versions (`docs/tech/standards.md`); caret within the locked
# major lines (`docs/tech/stack.md`). `egui` plus `egui-wgpu` joined the used
# set in #34 Phase A (`wgpu`, `naga` transitively); `winit` joins at first
# use in #44 Step 5 (D-003).
# Dev-shell `SimSnapshot` plain-data view (`bytemuck` `Pod`); D-row in Step 5.
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"
# Wired when the scheduler-storage work lands (D-004); kept here so the lock
# line stays the single source.
hecs = "0.11"
# D-005/D-009 (#34 Phase A): egui 0.36.2 plus paired egui-wgpu 0.36.2 for the
# debug-shell render bridge. Pairing verified 2026-09-27 via crates.io API:
# egui-wgpu 0.36.2 requires egui ^0.36.2 plus wgpu ^30.0; both declare
# rust-version 1.95, matching the workspace floor (docs/tech/stack.md).
egui = "0.36.2"
egui-wgpu = "0.36.2"
thiserror = "2"
anyhow = "1"
tracing = { version = "0.1", features = ["attributes"] }
mimalloc = "0.1"
# D-013 project PRNG (xoshiro256** plus SplitMix64 domains); see docs/tech/simulation.md.
rand_core = "0.10"
rand_xoshiro = "0.8"
# D-014 snapshot hash (xxh3-64); xxh3 feature only.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# D-017 deterministic math (pure-Rust libm, no arch asm) for sim transcendentals; see docs/tech/simulation.md.
# Deterministic cross-platform transcendentals for orbit math; see crates/engine/src/orbit.rs.
# default-features=false disables the arch assembly so Miri passes and x86_64/AArch64 agree.
libm = { version = "0.2", default-features = false }
# D-003 first use (#44 Step 5): winit 0.30.13 locked in `universe-debug`
# behind the non-default `dev-shell` feature. Default features; no extra
# backends. Engine sim stays winit-free; main thread owns winit per
# docs/tech/architecture.md.
winit = "0.30.13"
# D-003 first use (#44 Step 6): wgpu 30.0.1 surface plus device for the debug
# OS window behind `dev-shell`. Default features; versions stay on the locked
# 30.0 line (`egui-wgpu` 0.36.2 requires wgpu ^30.0). Engine sim stays
# wgpu-free; main thread owns the surface per docs/tech/architecture.md.
wgpu = "30"
universe-engine = { path = "crates/engine" }
universe-game = { path = "crates/game" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
cast_possible_truncation = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true

[package]
name = "universe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
universe-engine.workspace = true
universe-game.workspace = true
glam.workspace = true
libm.workspace = true

[features]
dev-shell = ["universe-engine/dev-shell"]
